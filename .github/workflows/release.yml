# Manual source-derived publication; no tag-push trigger or Bump linkage.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Window Style
  XCODE_PROJECT: Window Style.xcodeproj
  MACOS_DEPLOYMENT_TARGET: '11.0'
  PYTHONDONTWRITEBYTECODE: '1'

# Cross-ref publication exclusion, not a promise of FIFO scheduling.
concurrency:
  group: publish-window-style
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate immutable source and unused publication version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py preflight --sha "$EVENT_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py preflight --sha "$EVENT_SHA"

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials

      - name: Build fresh macOS plugin at the actual package root
        run: bash .github/scripts/native.sh build

      - name: Verify exact universal architectures and built metadata
        run: |
          bash .github/scripts/native.sh verify
          python3 .github/scripts/source_version.py --verify-bundle "test/Plugins/Window Style.bundle"

      - name: codesign
        run: bash .github/scripts/native.sh sign

      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/native.sh package

      - name: Revalidate retained outputs and create new tag, release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py publish --sha "$EVENT_SHA" "$ZIP_PATH" "$DMG_PATH"
